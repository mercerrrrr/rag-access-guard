[project]
name = "rag-access-guard-api"
version = "0.1.0"
description = "FastAPI service for the RAG Access Guard prototype"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anyio>=4.10,<4.15",
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
