[project]
name = "rag-access-guard-api"
version = "0.1.0"
description = "FastAPI service for the RAG Access Guard prototype"
requires-python = ">=3.13,<3.14"
dependencies = [
    "rag-access-guard",
    "alembic>=1.16,<2",
    "anyio>=4.10,<4.15",
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "typer>=0.24,<1",
    "uvicorn[standard]>=0.36,<1",
    "argon2-cffi>=25.1,<26",
]

[project.scripts]
rag-access-guard-api = "rag_access_guard_api.server:run"
rag-access-guard-create-user = "rag_access_guard_api.cli.create_user:main"

[tool.uv.sources]
rag-access-guard = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
