services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_access_guard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_USER: ${POSTGRES_USER:-rag_guard}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
